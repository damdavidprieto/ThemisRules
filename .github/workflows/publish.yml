name: Publish

# Same workflow in HermesConsoleUI, ArgosCCF and ThemisRules; only MODULE_NAME changes.
# Publishes output/<module> (never the repository root) to the PowerShell Gallery when a version
# tag is pushed, e.g. `git tag v1.3.0 && git push origin v1.3.0`, then creates a GitHub release
# with that version's CHANGELOG section.
# Needs these secrets in the `psgallery` environment:
#   PSGALLERY_API_KEY          a Gallery API key scoped to this package only
#   CODE_SIGNING_PFX_BASE64    the code signing certificate (.pfx), base64-encoded
#   CODE_SIGNING_PFX_PASSWORD  the password of that .pfx
# Every .ps1, .psm1 and .psd1 is Authenticode-signed before it is published; the job fails if
# the signature is not valid.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  MODULE_NAME: ThemisRules

jobs:
  publish:
    runs-on: windows-latest
    environment: psgallery
    steps:
      - uses: actions/checkout@v7

      - name: Analyze, test and build
        shell: pwsh
        run: ./build.ps1 -InstallDependencies

      - name: Sign the module with the code signing certificate
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CODE_SIGNING_PFX_BASE64) { throw 'CODE_SIGNING_PFX_BASE64 secret is not set: the module must be signed before it is published.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
          try {
              $password = ConvertTo-SecureString $env:CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          }
          finally {
              Remove-Item -LiteralPath $pfxPath -Force
          }
          # Compare the OID, not the name: the friendly name is localised ("Code Signing", "Firma de código"...).
          if (-not ($cert.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3')) { throw 'The certificate is not a code signing certificate.' }

          $files = Get-ChildItem -Path "./output/$env:MODULE_NAME" -Recurse -File -Include '*.ps1', '*.psm1', '*.psd1'
          $results = $files | Set-AuthenticodeSignature -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          $bad = @($results | Where-Object { $_.Status -ne 'Valid' })
          if ($bad) { throw "Signing failed for: $($bad.Path -join ', ') ($($bad.StatusMessage -join '; '))" }

          # Check every file again, the way a user's Install-Module would.
          $unsigned = @(Get-ChildItem -Path "./output/$env:MODULE_NAME" -Recurse -File -Include '*.ps1', '*.psm1', '*.psd1' |
              Get-AuthenticodeSignature | Where-Object { $_.Status -ne 'Valid' })
          if ($unsigned) { throw "Signature check failed for: $($unsigned.Path -join ', ')" }
          Write-Host "Signed $($files.Count) files with $($cert.Subject)"

      - name: Check the tag matches the manifest and the changelog
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile "./output/$env:MODULE_NAME/$env:MODULE_NAME.psd1").ModuleVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match ModuleVersion $version" }
          $changelog = Get-Content ./CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          Set-Content -Path release-notes.md -Value $section -Encoding utf8

      - name: Publish to the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set' }
          Publish-PSResource -Path "./output/$env:MODULE_NAME" -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:GITHUB_REF_NAME --title "$env:MODULE_NAME $env:GITHUB_REF_NAME" --notes-file release-notes.md
