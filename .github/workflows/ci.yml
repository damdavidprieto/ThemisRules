name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  powershell7:
    name: Analyze, test and build (PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Analyze, test and build
        shell: pwsh
        run: ./build.ps1

  windows-powershell:
    name: Tests and Install-Module on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and pack into a local repository (PowerShell 7)
        shell: pwsh
        run: |
          ./build.ps1 -SkipAnalysis -SkipTests
          $repo = Join-Path $env:RUNNER_TEMP 'localrepo'
          New-Item -ItemType Directory -Path $repo -Force | Out-Null
          Register-PSResourceRepository -Name LocalRepo -Uri $repo -Trusted
          Publish-PSResource -Path ./output/ThemisRules -Repository LocalRepo
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead((Get-ChildItem $repo -Filter *.nupkg).FullName).Entries.FullName
          $entries
          if ($entries -match '^(\.git|\.github|Tests)/') { throw 'Package contains repository-only files' }

      - name: Run the Pester suite (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

      - name: Install with Install-Module and auto-load (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Register-PSRepository -Name LocalRepo -SourceLocation (Join-Path $env:RUNNER_TEMP 'localrepo') -InstallationPolicy Trusted
          Install-Module ThemisRules -Repository LocalRepo -Scope CurrentUser
          $providers = Get-ThemisProviders
          $module = Get-Module ThemisRules
          if (-not $module) { throw 'Module was not auto-loaded' }
          "Loaded $($module.Name) $($module.Version): $($providers.Type -join ', ')"
          if ($module.ExportedFunctions.Count -ne 4) { throw "Expected 4 exported functions, got $($module.ExportedFunctions.Count)" }
